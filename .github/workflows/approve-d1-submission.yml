name: Review D1 submission

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Badge-verified D1 submission UUID'
        required: true
        type: string
      confirmation:
        description: 'Type approve-serp.software-submission-production'
        required: true
        type: string
      decision:
        description: 'Approve publishes a verified row; reject closes pending or verified intake'
        required: true
        type: choice
        options:
          - approve
          - reject

concurrency:
  group: serp-software-production-d1
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  approve:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'approve-serp.software-submission-production'
    environment:
      name: production
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/install
      - name: Run D1 contract tests
        run: pnpm test:d1
      - name: Back up production D1
        env: &production_env
          CI: 'true'
          GITHUB_ACTIONS: 'true'
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKER_PRODUCTION_CONFIRM: approve-serp.software-submission-production
          D1_SUBMISSION_APPROVAL_CONFIRM: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_PRODUCTION_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_PRODUCTION_DATABASE_ID }}
          CLOUDFLARE_D1_PRODUCTION_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_PRODUCTION_DATABASE_NAME }}
          CLOUDFLARE_WORKER_PRODUCTION_NAME: ${{ secrets.CLOUDFLARE_WORKER_PRODUCTION_NAME }}
        run: pnpm worker:d1:backup:production
      - name: Retain pre-approval backup
        uses: actions/upload-artifact@v6
        with:
          name: serp-software-d1-pre-submission-approval-${{ github.sha }}
          path: .wrangler/backups/${{ github.sha }}.sql
          if-no-files-found: error
          retention-days: 30
      - name: Apply submission schema migrations
        env: *production_env
        run: pnpm worker:d1:migrate:production
      - name: Review D1 submission
        env: *production_env
        run: pnpm d1:approve:production -- "${{ inputs.submission_id }}" "${{ inputs.decision }}"
      - name: Close the admin review issue
        uses: actions/github-script@v8
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
          SUBMISSION_DECISION: ${{ inputs.decision }}
          SUBMISSION_REVIEWER: ${{ github.actor }}
        with:
          script: |
            const marker = `<!-- serp-submission-id: ${process.env.SUBMISSION_ID} -->`
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            })
            const issue = issues.find(item => !item.pull_request && item.body?.includes(marker))
            if (!issue) {
              core.notice('No GitHub review issue exists for this D1 submission.')
              return
            }
            if (issue.state === 'closed') {
              core.notice(`Review issue #${issue.number} is already closed.`)
              return
            }
            const outcome =
              process.env.SUBMISSION_DECISION === 'approve'
                ? 'approved and published'
                : 'declined without publishing'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `D1 submission **${outcome}** by @${process.env.SUBMISSION_REVIEWER}.`
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'completed'
            })
