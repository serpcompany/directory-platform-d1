name: Publish D1 Catalog

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Reviewed manifest under d1/publications'
        required: true
        type: string
      confirmation:
        description: 'Type publish-serp.software-production to authorize publication'
        required: true
        type: string

concurrency:
  group: serp-software-production-d1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-serp.software-production'
    environment:
      name: production
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Run publisher contract tests
        run: pnpm test:d1

      - name: Back up production D1
        env: &production_env
          CI: 'true'
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          WORKER_PRODUCTION_CONFIRM: ${{ inputs.confirmation }}
          D1_PUBLICATION_CONFIRM: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_PRODUCTION_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_PRODUCTION_DATABASE_ID }}
          CLOUDFLARE_D1_PRODUCTION_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_PRODUCTION_DATABASE_NAME }}
          CLOUDFLARE_WORKER_PRODUCTION_NAME: ${{ secrets.CLOUDFLARE_WORKER_PRODUCTION_NAME }}
        run: pnpm worker:d1:backup:production

      - name: Retain pre-publication backup
        uses: actions/upload-artifact@v6
        with:
          name: serp-software-d1-pre-publication-${{ github.sha }}
          path: .wrangler/backups/${{ github.sha }}.sql
          if-no-files-found: error
          retention-days: 30

      - name: Publish reviewed manifest
        env: *production_env
        run: pnpm d1:publish:production -- "${{ inputs.manifest_path }}"
