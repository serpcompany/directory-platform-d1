name: Validate Listing Sources

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/serp.software/**'
      - 'd1/**'
      - 'scripts/d1-**'
      - 'wrangler*.jsonc'
  push:
    branches: [main]
    paths:
      - 'apps/serp.software/**'
      - 'd1/**'
      - 'scripts/d1-**'
      - 'wrangler*.jsonc'

concurrency:
  group: validate-listing-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-listing-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Validate Worker configuration contracts
        run: pnpm worker:config:validate

      - name: Run D1 contract tests
        run: pnpm test:d1

      - name: Build OpenNext Worker
        run: pnpm worker:build
