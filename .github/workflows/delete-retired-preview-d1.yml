name: Delete retired Preview D1

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'Site whose exact retired Preview D1 will be deleted'
        required: true
        type: choice
        options:
          - pornvideodownloaders.com
          - serp.software
      confirmation:
        description: 'Type delete-retired-<site>-preview-d1'
        required: true
        type: string

concurrency:
  group: ${{ inputs.site_id }}-preview-d1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  delete:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == format('delete-retired-{0}-preview-d1', inputs.site_id)
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.site_id == 'pornvideodownloaders.com' && 'pornvideodownloaders-preview' || 'serp-software-preview' }}
    env:
      CI: 'true'
      D1_PROTECTED_ENVIRONMENT: ${{ inputs.site_id == 'pornvideodownloaders.com' && 'pornvideodownloaders-preview' || 'serp-software-preview' }}
      D1_RETIRED_PREVIEW_DELETE_CONFIRM: ${{ inputs.confirmation }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EXPECTED_ACCOUNT_ID: ${{ vars.CLOUDFLARE_EXPECTED_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install pinned dependencies
        uses: ./.github/actions/install

      - name: Validate retired Preview deletion contracts
        run: pnpm exec vitest run scripts/d1-retired-preview-delete.test.ts

      - name: Prove identities and export the retired Preview D1
        run: |
          mkdir -p "$RUNNER_TEMP/retired-preview-d1"
          pnpm tsx scripts/d1-retired-preview-delete.ts preflight \
            --site "${{ inputs.site_id }}" \
            --receipt "$RUNNER_TEMP/retired-preview-d1/preflight.json" \
            --export "$RUNNER_TEMP/retired-preview-d1/pre-delete.sql" \
            --output "$RUNNER_TEMP/retired-preview-d1/preflight.json"

      - name: Retain pre-delete SQL export and identity receipt
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.site_id }}-retired-preview-d1-pre-delete-${{ github.sha }}
          path: |
            ${{ runner.temp }}/retired-preview-d1/preflight.json
            ${{ runner.temp }}/retired-preview-d1/pre-delete.sql
          if-no-files-found: error
          retention-days: 90

      - name: Delete only the proved retired Preview D1
        run: |
          pnpm tsx scripts/d1-retired-preview-delete.ts delete \
            --site "${{ inputs.site_id }}" \
            --receipt "$RUNNER_TEMP/retired-preview-d1/preflight.json" \
            --export "$RUNNER_TEMP/retired-preview-d1/pre-delete.sql" \
            --output "$RUNNER_TEMP/retired-preview-d1/final.json"

      - name: Retain final deletion receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.site_id }}-retired-preview-d1-final-${{ github.sha }}
          path: ${{ runner.temp }}/retired-preview-d1/final.json
          if-no-files-found: error
          retention-days: 90
