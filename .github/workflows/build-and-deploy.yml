name: Build & Deploy Worker

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'Production Worker target'
        required: true
        type: choice
        options:
          - serp.software
      confirmation:
        description: 'Type deploy-serp.software-production to authorize production changes'
        required: true
        type: string
      release_mode:
        description: 'Deploy only the Worker, or also update the production D1 database'
        required: true
        default: worker-only
        type: choice
        options:
          - worker-only
          - database-and-worker

concurrency:
  group: ${{ inputs.site_id }}-production-d1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate, Build & Deploy serp.software Worker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'deploy-serp.software-production'
    environment:
      name: production
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Validate Worker configuration contracts
        run: pnpm tsx scripts/worker-release.ts validate-replatform production --site serp.software

      - name: Run D1 contract tests
        run: pnpm test:d1

      - name: Type check
        run: pnpm typecheck

      - name: Build OpenNext Worker
        run: pnpm worker:build:serpsoftware

      - name: Plan production migration without remote execution
        if: inputs.release_mode == 'database-and-worker'
        env:
          D1_REMOTE_CONFIRM: plan-serp.software-production
          D1_RELEASE_GENERATION: replatform
        run: pnpm d1:remote:migration:plan:production

      - name: Plan production verification without remote execution
        if: inputs.release_mode == 'database-and-worker'
        env:
          D1_REMOTE_CONFIRM: plan-serp.software-production
          D1_RELEASE_GENERATION: replatform
        run: pnpm d1:remote:verify:plan:production

      - name: Back up production D1
        if: inputs.release_mode == 'database-and-worker'
        env: &production_env
          CI: 'true'
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          D1_RELEASE_GENERATION: replatform
          WORKER_PRODUCTION_CONFIRM: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_ID }}
          CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_REPLACEMENT_PRODUCTION_DATABASE_NAME }}
          CLOUDFLARE_WORKER_PRODUCTION_NAME: ${{ secrets.CLOUDFLARE_WORKER_PRODUCTION_NAME }}
        run: pnpm worker:d1:backup:production

      - name: Retain production D1 backup
        if: inputs.release_mode == 'database-and-worker'
        uses: actions/upload-artifact@v6
        with:
          name: serp-software-d1-${{ github.sha }}
          path: .wrangler/backups/serp-software/production/${{ github.sha }}.replatform.sql
          if-no-files-found: error
          retention-days: 30

      - name: Apply production D1 migrations
        if: inputs.release_mode == 'database-and-worker'
        env: *production_env
        run: pnpm worker:d1:migrate:production

      - name: Verify schema compatibility and deploy production Worker
        env: *production_env
        run: |
          set -euo pipefail
          pnpm tsx scripts/worker-release.ts check-schema production --site serp.software
          pnpm worker:deploy:production
